# Ashfall — a rich example world pack (docs/09). Grades "runnable".

[world]
name = "Ashfall"
tone = ["grim", "low-magic", "political"]
starting_gear = ["a traveler's knife"]       # what a fresh PC carries here (D-97)

[content]
rating = "mature"
enabled = ["violence", "horror"]
disabled = ["sexual_content"]

[calendar]
days_per_year = 360
seasons = ["thaw", "highsun", "harvest", "longdark"]
epoch_label = "After the Sundering"

[pacing]                 # D-96: this world opts in to the pacing director (off by default)
quiet_after = 25         # name a plot that hasn't come up for 25 beats…
every = 10               # …at most once every 10 beats

[ruleset]
id = "uro-basic"
version = ">=0"

[history]
seed_era = "aftermath-of-empire"
simulate_years = 200

[history.vocabulary]     # D-97: the words `uro world seed` builds this world's past from
groups = ["Corvane", "Ashmoor", "Dunhallow", "Verric", "Thorne", "Blackmere", "Halloway", "Estmark", "Grausel", "Vane"]
group_name = "House {name}"
group_description = "A dynasty risen in {era}."
titles = ["King", "Queen", "Duke", "Warden", "High Lord", "Reeve"]
leaders = ["Aldric", "Mira", "Sorel", "Ysolde", "Bram", "Cael", "Nessa", "Roderic"]
leader_role = "ruler"
calamities = ["a great plague", "a border war", "a failed harvest", "a schism of faith", "a drowned fleet"]

[llm.roles]
narrator = "anthropic:claude-sonnet-5"
