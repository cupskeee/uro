# Emberfell — the example pack bound to the ALIEN ruleset (uro_pbta, PbtA 2d6). Proves a world
# pack selects a NON-d20 ruleset and a campaign plays under it end-to-end (docs/06, D-30). Grades
# "runnable" (3 actors, a conflict seed, tone, seeded history).

[world]
name = "Emberfell"
tone = ["gritty", "frontier", "desperate"]

[content]
rating = "mature"
enabled = ["violence"]

[calendar]
days_per_year = 300
seasons = ["thaw", "dust", "emberfall", "frost"]

[ruleset]
id = "uro-pbta"
version = ">=0"

[history]
seed_era = "the-strike-that-emptied"
simulate_years = 40

[history.vocabulary]     # D-97: the words `uro world seed` builds this world's past from
groups = ["Cinder", "Ashgrove", "Redline", "Hollow Pike", "Slagwater"]
group_name = "the {name} Company"
group_description = "A company that dug in during {era}."
titles = ["Boss", "Foreman", "Marshal"]
leaders = ["Hale", "Corra", "Dutch", "Ines", "Kettle", "Moss"]
leader_role = "boss"
calamities = ["a mine collapse", "a strike broken with rifles", "a fever in the camps", "a dry season that killed the herds"]
