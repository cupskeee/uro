# Thornwood — a deliberately THIN example pack (docs/09). Grades "thin": everything is present
# except conflict seeds, so `uro world validate` flags it and the AI backfill pass can fill it.

[world]
name = "Thornwood"
tone = ["pastoral", "cozy"]
starting_gear = ["a walking stick"]       # what a fresh PC carries here (D-97)

[content]
rating = "mild"
enabled = []

[calendar]
days_per_year = 360
seasons = ["spring", "summer", "autumn", "winter"]

[ruleset]
id = "uro-basic"

[history]
seed_era = "the-long-peace"
simulate_years = 50

[history.vocabulary]     # D-97: the words `uro world seed` builds this world's past from
groups = ["Hollins", "Brackwell", "Fenmoor", "Applegarth", "Ivybridge", "Tansy"]
group_name = "the {name} family"
group_description = "A family rooted here since {era}."
leaders = ["Old Tam", "Widow Marsh", "Elder Rook", "Cobb", "Hetty", "Wren Ashby"]
leader_role = "head of the family"
calamities = ["a hard winter", "a flood on the water meadows", "a blight in the orchards", "a quarrel over the mill"]
