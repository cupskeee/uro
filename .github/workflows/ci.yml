# CI gate per docs/14: lint -> types -> import contracts -> tests (replay only).
# CI never makes live LLM calls.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the repo (OpenSSF Scorecard hardening).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: uro
          POSTGRES_USER: uro
          POSTGRES_PASSWORD: uro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uro -d uro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # The outbox relay's JetStream test (D-57) needs a NATS server with JetStream on; a service
      # container can't pass the `-js` flag, so start it here (the test skips if it's absent).
      - run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
      - run: uv run pytest
        env:
          URO_DATABASE_URL: postgresql://uro:uro@localhost:5432/uro
          URO_TEST_NATS: nats://localhost:4222
