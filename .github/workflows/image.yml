# The uro-server container image → ghcr.io (D-94, docs/14). OWNER-ACTIVATED and MANUAL by design,
# like publish.yml: nothing is pushed until the owner runs it (Actions → image → Run workflow) on a
# release tag. The image is tagged with the packages' version and `latest`. It authenticates with
# the job's own GITHUB_TOKEN (packages: write) — no stored token, no third-party marketplace
# actions. A first push creates the ghcr package; its visibility is set in the package settings.
name: image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('packages/uro-server/pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uro-server"
          docker build -t "$image:${{ steps.version.outputs.version }}" -t "$image:latest" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Smoke
        run: |
          docker run --rm "$IMAGE:latest" --help
          # a public bind without a token is refused (the default 'local' token is guessable)
          ! docker run --rm "$IMAGE:latest" serve --host 0.0.0.0
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"
