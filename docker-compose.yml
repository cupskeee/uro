# Local infrastructure. Local IS Postgres — no SQLite mode (D-13). docs/14.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: uro
      POSTGRES_USER: uro
      POSTGRES_PASSWORD: uro
    ports:
      - "5433:5432" # host 5433: another Docker Postgres already owns 5432 on the dev machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uro -d uro"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional (D-57): the NATS JetStream server the outbox relay publishes to. Not started by a plain
  # `docker compose up` — opt in with `docker compose --profile nats up -d`. Bound to localhost:
  # anything that can publish to it can announce commits to `uro serve --nats` (which then checks
  # each one against its own database before telling a client).
  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    profiles: ["nats"]
    ports:
      - "127.0.0.1:4222:4222"

volumes:
  pgdata:
